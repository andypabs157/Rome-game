<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Adventure: Rome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');
        :root { --app-height: 100dvh; }
        body { font-family: 'Inter', sans-serif; color: #000; background: #fff; height: var(--app-height); overflow: hidden; display: flex; flex-direction: column; }
        .serif { font-family: 'Lora', serif; }
        .story-card { border: 1px solid #000; background: #fff; margin-bottom: 2rem; animation: fadeIn 0.4s ease-out; overflow: hidden; }
        .scene-image-container { width: 100%; aspect-ratio: 1 / 1; background: #f3f3f3; border-bottom: 1px solid #000; }
        .scene-image { width: 100%; height: 100%; object-fit: cover; }
        .choice-btn { display: block; width: 100%; text-align: left; padding: 1rem; border: 1px solid #e5e5e5; margin-top: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .badge { display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; border: 1px solid #000; margin-bottom: 10px; }
        .success { background: #000; color: #fff; }
        .mixed { background: #eee; color: #000; }
        .failure { background: #fff; color: #000; border-style: dashed; }
        #story-container { -webkit-overflow-scrolling: touch; flex: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loading-dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; } }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen" class="fixed inset-0 z-50 bg-white flex items-center justify-center p-6 overflow-y-auto">
        <div class="max-w-md w-full space-y-6 py-6">
            <div class="text-center">
                <h1 class="text-4xl font-black tracking-tighter italic uppercase">Rome</h1>
                <p class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mt-1">Attribute RPG Engine</p>
            </div>
            
            <div class="space-y-4">
                <input type="password" id="api-key" placeholder="API Key" class="w-full p-4 border-2 border-black outline-none">
                <input type="text" id="char-name" placeholder="Character Name" class="w-full p-4 border-2 border-black outline-none">
                
                <div class="space-y-3 border-t border-black pt-4">
                    <div class="grid grid-cols-2 gap-x-4 gap-y-2">
                        <div class="text-[9px] font-black uppercase">Strength: <span id="v-str">5</span></div>
                        <input type="range" id="attr-str" min="1" max="10" value="5" class="w-full h-1 bg-black appearance-none" oninput="document.getElementById('v-str').innerText=this.value">
                        
                        <div class="text-[9px] font-black uppercase">Charm: <span id="v-cha">5</span></div>
                        <input type="range" id="attr-cha" min="1" max="10" value="5" class="w-full h-1 bg-black appearance-none" oninput="document.getElementById('v-cha').innerText=this.value">

                        <div class="text-[9px] font-black uppercase">Intelligence: <span id="v-int">5</span></div>
                        <input type="range" id="attr-int" min="1" max="10" value="5" class="w-full h-1 bg-black appearance-none" oninput="document.getElementById('v-int').innerText=this.value">

                        <div class="text-[9px] font-black uppercase">Weapon Skill: <span id="v-wea">5</span></div>
                        <input type="range" id="attr-wea" min="1" max="10" value="5" class="w-full h-1 bg-black appearance-none" oninput="document.getElementById('v-wea').innerText=this.value">
                    </div>
                </div>

                <button id="start-btn" class="w-full bg-black text-white p-5 font-black uppercase tracking-widest active:scale-95 transition-all text-sm">Enter the Empire</button>
            </div>
            <div id="debug-log" class="hidden text-[9px] font-mono p-3 bg-red-50 text-red-700 border border-red-200"></div>
        </div>
    </div>

    <header class="border-b-2 border-black p-3 px-4 flex justify-between items-center shrink-0">
        <h2 class="font-black text-xl italic">IA.</h2>
        <div id="ui-meta" class="hidden flex gap-3 text-[8px] font-black uppercase">
            <span>S:<span id="h-str"></span></span> <span>C:<span id="h-cha"></span></span> <span>W:<span id="h-wea"></span></span>
        </div>
        <button onclick="localStorage.clear(); location.reload();" class="text-[9px] font-black text-red-600 uppercase">Reset</button>
    </header>

    <main id="story-container" class="overflow-y-auto p-4 space-y-10 flex-1"></main>

    <footer class="p-3 border-t-2 border-black bg-white">
        <div id="choices-container" class="mb-3 space-y-1"></div>
        <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="Custom action..." class="flex-1 p-3 border-2 border-black outline-none serif text-base italic" disabled>
            <button id="send-btn" class="bg-black text-white px-5 font-black uppercase text-xs" disabled>Go</button>
        </div>
    </footer>

    <script>
        let state = { apiKey: "", name: "", model: "gemini-1.5-flash", history: [], attrs: {} };

        const debug = (msg) => {
            const d = document.getElementById('debug-log');
            d.classList.remove('hidden');
            d.innerText = msg;
        };

        document.getElementById('start-btn').addEventListener('click', async () => {
            const key = document.getElementById('api-key').value.trim();
            const name = document.getElementById('char-name').value.trim();
            if(!key || !name) return alert("Enter Key and Name");
            
            state.apiKey = key;
            state.name = name;
            state.attrs = {
                str: document.getElementById('attr-str').value,
                cha: document.getElementById('attr-cha').value,
                int: document.getElementById('attr-int').value,
                wea: document.getElementById('attr-wea').value
            };

            await start();
        });

        async function start() {
            debug("Connecting to Rome...");
            try {
                // Determine model availability using a safer method
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${state.apiKey}`);
                if(!res.ok) throw new Error(`Status ${res.status}: Check API Key`);
                const data = await res.json();
                const mList = data.models.map(m => m.name.split('/').pop());
                state.model = mList.includes("gemini-3.6-flash") ? "gemini-3.6-flash" : "gemini-1.5-flash";

                const sys = `Ancient Rome RPG. Player: ${state.name}. Attributes: Str:${state.attrs.str}, Cha:${state.attrs.cha}, Int:${state.attrs.int}, Wea:${state.attrs.wea}. 
                MECHANICS: Determine Success/Mixed/Failure for actions (Success min 10%). 
                IMAGES: Detailed 1:1 Portrait prompts.
                STRICT JSON: { "story": "...", "outcome": "Success|Mixed|Failure", "imagePrompt": "...", "options": ["A","B","C"] }`;

                const success = await callAI(sys, true);
                if(success) {
                    document.getElementById('setup-screen').classList.add('hidden');
                    document.getElementById('ui-meta').classList.remove('hidden');
                    document.getElementById('h-str').innerText = state.attrs.str;
                    document.getElementById('h-cha').innerText = state.attrs.cha;
                    document.getElementById('h-wea').innerText = state.attrs.wea;
                    document.getElementById('user-input').disabled = false;
                    document.getElementById('send-btn').disabled = false;
                }
            } catch(e) { debug("Connection Failed: " + e.message); }
        }

        async function callAI(prompt, isInit = false) {
            showLoader();
            // Use v1 for stability on mobile
            const url = `https://generativelanguage.googleapis.com/v1/models/${state.model}:generateContent?key=${state.apiKey}`;
            const contents = [...state.history, { role: "user", parts: [{ text: prompt }] }];

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents })
                });

                if(!res.ok) throw new Error(`API Error ${res.status}`);
                
                const data = await res.json();
                let raw = data.candidates[0].content.parts[0].text;
                
                // Clean markdown if AI sends it
                raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();
                const json = JSON.parse(raw);

                state.history.push({ role: "user", parts: [{ text: isInit ? "Start" : prompt }] });
                state.history.push({ role: "model", parts: [{ text: raw }] });

                render(json);
                return true;
            } catch(e) { 
                debug("Load Failed: " + e.message); 
                return false; 
            } finally { hideLoader(); }
        }

        function render(data) {
            const container = document.getElementById('story-container');
            const card = document.createElement('div');
            card.className = 'story-card';

            const img = document.createElement('img');
            img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(data.imagePrompt + ", portrait, rome")}?width=1000&height=1000&nologo=true&seed=${Math.random()}`;
            img.className = 'scene-image';
            
            const text = document.createElement('div');
            text.className = 'p-6 serif text-xl md:text-2xl';
            text.innerHTML = `<div class="badge ${data.outcome?.toLowerCase() || 'success'}">${data.outcome || 'Scene'}</div><p>${data.story}</p>`;
            
            card.append(img, text);
            container.appendChild(card);

            const cb = document.getElementById('choices-container');
            cb.innerHTML = '';
            data.options.forEach(o => {
                const b = document.createElement('button');
                b.className = 'choice-btn';
                b.innerText = o;
                b.onclick = () => act(o);
                cb.appendChild(b);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function act(val) {
            if(!val) return;
            document.getElementById('user-input').value = "";
            document.getElementById('user-input').blur();
            const d = document.createElement('div');
            d.className = 'user-action serif text-gray-400 mb-6';
            d.innerText = `> ${val}`;
            document.getElementById('story-container').appendChild(d);
            document.getElementById('choices-container').innerHTML = '';
            await callAI(`Action: "${val}". Resolve based on attributes.`);
        }

        document.getElementById('send-btn').onclick = () => act(document.getElementById('user-input').value);
        document.getElementById('user-input').onkeypress = (e) => { if(e.key==='Enter') act(e.target.value); };

        function showLoader() {
            const l = document.createElement('div');
            l.id = 'loader'; l.className = 'text-center font-bold text-[10px] py-10 loading-dots uppercase';
            l.innerText = 'The Fates are deciding';
            document.getElementById('story-container').appendChild(l);
            document.getElementById('story-container').scrollTop = document.getElementById('story-container').scrollHeight;
        }
        function hideLoader() { document.getElementById('loader')?.remove(); }
    </script>
</body>
</html>
