<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Adventure: Rome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');
        
        :root {
            /* Fix for mobile browser address bars */
            --app-height: 100dvh;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            color: #000; 
            background: #fff; 
            height: var(--app-height);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .serif { font-family: 'Lora', serif; }
        
        /* Mobile-optimized cards */
        .story-card { 
            border: 1px solid #000; 
            background: #fff; 
            margin-bottom: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        .user-action { 
            border-left: 3px solid #000; 
            padding-left: 1rem; 
            margin-left: auto; 
            max-width: 90%; 
            font-style: italic; 
            color: #666; 
            margin-bottom: 2rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .loading-dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; } }

        /* Ensure smooth scrolling on iOS */
        #story-container {
            -webkit-overflow-scrolling: touch;
            flex: 1;
        }

        /* Fix for input bar on mobile focus */
        footer {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>

    <!-- Setup Screen (Mobile Responsive) -->
    <div id="setup-screen" class="fixed inset-0 z-50 bg-white flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-md w-full space-y-6 py-8">
            <div class="text-center">
                <h1 class="text-4xl font-black tracking-tighter italic">ROME: ASCENSION</h1>
                <p class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mt-2">Mobile Story Engine</p>
            </div>
            
            <div class="space-y-4">
                <input type="password" id="api-key" placeholder="API Key" class="w-full p-4 border-2 border-black outline-none text-base">
                <input type="text" id="char-name" placeholder="Soldier Name" class="w-full p-4 border-2 border-black outline-none text-base">
                <button id="start-btn" class="w-full bg-black text-white p-5 font-black uppercase tracking-widest hover:bg-gray-800 active:scale-95 transition-all text-sm">Begin My Service</button>
            </div>
            
            <div id="setup-log" class="hidden text-[10px] font-mono bg-gray-50 p-3 border border-black/5 max-h-24 overflow-y-auto">
                <div id="log-content"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Header -->
    <header class="border-b-2 border-black p-3 px-4 flex justify-between items-center bg-white sticky top-0 z-40">
        <h2 class="font-black text-xl italic">IA.</h2>
        <div id="ui-meta" class="hidden flex gap-3 text-[9px] font-black uppercase tracking-tighter">
            <span class="truncate max-w-[80px]"><span class="text-gray-400">L:</span> <span id="ui-location">...</span></span>
            <span><span class="text-gray-400">R:</span> <span id="ui-rank">Recruit</span></span>
        </div>
        <button onclick="resetGame()" class="text-[9px] font-black uppercase text-red-600">Reset</button>
    </header>

    <!-- Content Area -->
    <main id="story-container" class="overflow-y-auto p-4 md:p-20 space-y-6 bg-white"></main>

    <!-- Mobile Input (Pinned to Keyboard) -->
    <footer class="p-3 border-t-2 border-black bg-white">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Your action..." 
                class="flex-1 p-3 border-2 border-black outline-none serif text-lg italic" disabled>
            <button id="send-btn" class="bg-black text-white px-5 font-black uppercase text-xs disabled:bg-gray-200" disabled>Act</button>
        </div>
    </footer>

    <script>
        let state = {
            apiKey: "",
            characterName: "",
            location: "Legion Camp",
            rank: "Recruit",
            inventory: [],
            history: [],
            activeModel: "" 
        };

        const log = (msg) => {
            document.getElementById('setup-log').classList.remove('hidden');
            const d = document.createElement('div'); d.innerText = `> ${msg}`;
            document.getElementById('log-content').appendChild(d);
        };

        document.getElementById('start-btn').addEventListener('click', async () => {
            const key = document.getElementById('api-key').value.trim();
            const name = document.getElementById('char-name').value.trim();
            if (!key || !name) return alert("Missing data.");
            state.apiKey = key;
            state.characterName = name;
            await init();
        });

        async function init() {
            log("Identifying model...");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${state.apiKey}`);
                const data = await res.json();
                const models = data.models.map(m => m.name.split('/').pop());
                
                // Adaptive logic for your account
                state.activeModel = models.includes("gemini-3.6-flash") ? "gemini-3.6-flash" : 
                                  (models.includes("gemini-1.5-flash") ? "gemini-1.5-flash" : models[0]);

                const prompt = `Roman Military RPG. Player: ${state.characterName}. 
                Rank Path: Recruit -> Legionary -> Centurion -> General. 
                Focus on Roman soldier life. Rule: End with 1 question. 
                State: <STATE>{"location":"...","rank":"...","inventory":[]}</STATE>. Start now.`;

                const started = await callAI(prompt, true);
                if (started) {
                    document.getElementById('setup-screen').classList.add('hidden');
                    document.getElementById('ui-meta').classList.remove('flex');
                    document.getElementById('ui-meta').style.display = 'flex';
                    document.getElementById('user-input').disabled = false;
                    document.getElementById('send-btn').disabled = false;
                }
            } catch (e) { log(`Error: ${e.message}`); }
        }

        async function callAI(prompt, isSystem = false) {
            showLoader();
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${state.activeModel}:generateContent?key=${state.apiKey}`;
            const contents = [...state.history, { role: "user", parts: [{ text: prompt }] }];

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                
                const stateMatch = text.match(/<STATE>([\s\S]*?)<\/STATE>/);
                const story = text.replace(/<STATE>[\s\S]*?<\/STATE>/, "").trim();

                if (stateMatch) {
                    const s = JSON.parse(stateMatch[1]);
                    state.location = s.location || state.location;
                    state.rank = s.rank || state.rank;
                    document.getElementById('ui-location').innerText = state.location;
                    document.getElementById('ui-rank').innerText = state.rank;
                }

                state.history.push({ role: "user", parts: [{ text: isSystem ? "Start." : prompt }] });
                state.history.push({ role: "model", parts: [{ text: story }] });

                const card = document.createElement('div');
                card.className = 'story-card p-5 md:p-10 serif text-lg md:text-2xl leading-relaxed';
                card.innerHTML = story.replace(/\n/g, '<br>');
                document.getElementById('story-container').appendChild(card);
                
                scroll();
                localStorage.setItem('ia_mobile_save', JSON.stringify(state));
                return true;
            } catch (e) { alert(e.message); return false; } finally { hideLoader(); }
        }

        async function handleAction() {
            const val = document.getElementById('user-input').value.trim();
            if (!val) return;
            document.getElementById('user-input').value = "";
            document.getElementById('user-input').blur(); // Hides keyboard on submit for better view

            const d = document.createElement('div');
            d.className = 'user-action serif text-base md:text-xl';
            d.innerText = `> ${val}`;
            document.getElementById('story-container').appendChild(d);

            await callAI(`Player action: "${val}". Describe the Roman military outcome.`);
        }

        document.getElementById('send-btn').addEventListener('click', handleAction);
        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key==='Enter') handleAction(); });

        function showLoader() {
            const l = document.createElement('div');
            l.id = 'loader';
            l.className = 'text-center font-bold text-[10px] py-4 loading-dots uppercase';
            l.innerText = 'Narrator writing';
            document.getElementById('story-container').appendChild(l);
            scroll();
        }

        function hideLoader() { document.getElementById('loader')?.remove(); }
        function scroll() { const c = document.getElementById('story-container'); c.scrollTop = c.scrollHeight; }
        function resetGame() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem('ia_mobile_save');
            if (saved) {
                const s = JSON.parse(saved);
                document.getElementById('api-key').value = s.apiKey || "";
                document.getElementById('char-name').value = s.characterName || "";
            }
        };
    </script>
</body>
</html>
